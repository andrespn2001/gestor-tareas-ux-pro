<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow AI - Andrés Lucas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="notificaciones"></div>

    <div class="app">
        <h1>🤖 TaskFlow AI</h1>
        <div id="contador">0 tareas pendientes</div>

        <div class="controles">
            <input type="text" id="input-tarea" placeholder="Nueva tarea...">
            <select id="input-categoria">
                <option value="Personal">🏠 Personal</option>
                <option value="Trabajo">💼 Trabajo</option>
                <option value="Estudio">📚 Estudio</option>
            </select>
            <button id="btn-ia">🪄</button>
            <button id="btn-añadir">Añadir</button>
        </div>
        
        <button id="btn-csv">📥 Exportar CSV</button>
        <ul id="lista-tareas"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
